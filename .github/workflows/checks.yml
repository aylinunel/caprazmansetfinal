name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Offline pipeline tests (no network, no database)
        working-directory: pipeline
        run: python -m unittest discover -s tests -v

  biasguard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: BiasGuard offline tests (no provider calls)
        run: python -m unittest biasguard.test_news -v
      - name: Review-status routing on the recorded run
        run: python -m unittest biasguard.test_routing -v
      - name: Media-technique catalogue
        run: python -m unittest biasguard.test_catalog_media -v

  site-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site logic tests
        run: node --test site/tests/logic.test.cjs

  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provenance and CI coverage tests
        run: python -m unittest discover -s tests_repo -t . -v

  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r pipeline/requirements.txt -r validation/requirements.txt
      - name: Validation lab and feedback tests (offline)
        run: python -m unittest discover -s validation/tests -t . -v

  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r validation/requirements.txt
      - name: Vendored Mesa simulator suite
        working-directory: validation/mesa_bias_expanded
        run: python -m pytest -q
